<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="28" fill="#F7F5EF"/>
  <rect x="40" y="40" width="1120" height="640" rx="22" stroke="#D3CEC1" stroke-width="1.5"/>
  <g opacity="0.5">
    <path d="M220 140V596" stroke="#E4DED1"/>
    <path d="M430 140V596" stroke="#E4DED1"/>
    <path d="M640 140V596" stroke="#E4DED1"/>
    <path d="M850 140V596" stroke="#E4DED1"/>
    <path d="M1060 140V596" stroke="#E4DED1"/>
    <path d="M140 250H1080" stroke="#E4DED1"/>
    <path d="M140 378H1080" stroke="#E4DED1"/>
    <path d="M140 506H1080" stroke="#E4DED1"/>
  </g>
  <text x="140" y="96" fill="#7B746A" font-family="Source Code Pro, monospace" font-size="20" letter-spacing="1.8">READINESS FRAMEWORK</text>
  <text x="140" y="128" fill="#131313" font-family="Outfit, Arial, sans-serif" font-size="40" font-weight="700">What a workable Apple discoverability stack needs</text>

  <g>
    <rect x="138" y="228" width="250" height="146" rx="22" fill="#FBFAF6" stroke="#D7D0C4"/>
    <text x="166" y="268" fill="#7B746A" font-family="Source Code Pro, monospace" font-size="16" letter-spacing="1.5">01 / ENTITY MODELING</text>
    <text x="166" y="308" fill="#131313" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700">Define the objects</text>
    <text x="166" y="336" fill="#5E5850" font-family="Outfit, Arial, sans-serif" font-size="18">
      <tspan x="166" dy="0">Products, accounts, and locations become</tspan>
      <tspan x="166" dy="24">stable app entities.</tspan>
    </text>
  </g>
  <g>
    <rect x="474" y="228" width="250" height="146" rx="22" fill="#F4F2FF" stroke="#B8B9F7"/>
    <text x="502" y="268" fill="#6A6CC1" font-family="Source Code Pro, monospace" font-size="16" letter-spacing="1.5">02 / ACTION DESIGN</text>
    <text x="502" y="308" fill="#131313" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700">Define the actions</text>
    <text x="502" y="336" fill="#4E4D67" font-family="Outfit, Arial, sans-serif" font-size="18">
      <tspan x="502" dy="0">Important user moves become callable</tspan>
      <tspan x="502" dy="24">intents across the system.</tspan>
    </text>
  </g>
  <g>
    <rect x="810" y="228" width="250" height="146" rx="22" fill="#FFF1EA" stroke="#D4A48D"/>
    <text x="838" y="268" fill="#98593D" font-family="Source Code Pro, monospace" font-size="16" letter-spacing="1.5">03 / ROUTING AND QA</text>
    <text x="838" y="308" fill="#131313" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700">Test the path</text>
    <text x="838" y="336" fill="#614C43" font-family="Outfit, Arial, sans-serif" font-size="18">
      <tspan x="838" dy="0">Spotlight states, deep links, and</tspan>
      <tspan x="838" dy="24">handoff stay reliable over time.</tspan>
    </text>
  </g>

  <g>
    <rect x="138" y="430" width="922" height="122" rx="18" fill="#FBFAF6" stroke="#D7D0C4"/>
    <text x="168" y="466" fill="#7B746A" font-family="Source Code Pro, monospace" font-size="16" letter-spacing="1.5">OUTPUT</text>
    <text x="168" y="502" fill="#131313" font-family="Outfit, Arial, sans-serif" font-size="26" font-weight="700">
      <tspan x="168" dy="0">System surfaces can search, suggest, and route into the app</tspan>
      <tspan x="168" dy="30">with less friction.</tspan>
    </text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M388 300H444" stroke="#2C8D7C" stroke-width="3"/>
    <path d="M724 300H780" stroke="#2C8D7C" stroke-width="3"/>
    <path d="M600 374V430" stroke="#2C8D7C" stroke-width="2.5"/>
  </g>
  <g fill="#2C8D7C">
    <path d="M444 300L432 293V307L444 300Z"/>
    <path d="M780 300L768 293V307L780 300Z"/>
    <path d="M600 430L593 418H607L600 430Z"/>
  </g>
</svg>
