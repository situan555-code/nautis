<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Tag Manager -->
<script>
  (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

  })(window,document,'script','dataLayer','GTM-5265XK6C');

<script>
  (() => {
    const storageKey = 'sunder-theme';
    const root = document.documentElement;

    try {
      const savedTheme = localStorage.getItem(storageKey);
      const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      const theme = savedTheme || systemTheme;
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
    } catch (error) {
      root.dataset.theme = 'dark';
      root.style.colorScheme = 'dark';
    }
  })();
</script>
<title>{{#if pageTitle}}{{pageTitle}} — {{site.name}}{{else}}{{site.name}} — {{site.tagline}}{{/if}}</title>
<meta name="description" content="{{#if pageDescription}}{{pageDescription}}{{else}}{{site.description}}{{/if}}">
{{#if noindex}}<meta name="robots" content="noindex,follow">{{/if}}
<link rel="icon" href="/favicon.ico" sizes="32x32">

<!-- Canonical URL (critical for SEO) -->
<link rel="canonical" href="{{#if canonicalUrl}}{{canonicalUrl}}{{else}}{{site.url}}{{/if}}">

<!-- Open Graph -->
<meta property="og:title" content="{{#if pageTitle}}{{pageTitle}} — {{site.name}}{{else}}{{site.name}} — {{site.tagline}}{{/if}}">
<meta property="og:description" content="{{#if pageDescription}}{{pageDescription}}{{else}}{{site.description}}{{/if}}">
<meta property="og:type" content="{{#if ogType}}{{ogType}}{{else}}website{{/if}}">
<meta property="og:url" content="{{#if canonicalUrl}}{{canonicalUrl}}{{else}}{{site.url}}{{/if}}">
{{#if ogImage}}<meta property="og:image" content="{{ogImage}}">{{/if}}
<meta property="og:site_name" content="Sunder & Co.">

<!-- Twitter Card -->
<meta name="twitter:card" content="{{#if ogImage}}summary_large_image{{else}}summary{{/if}}">
<meta name="twitter:title" content="{{#if pageTitle}}{{pageTitle}} — {{site.name}}{{else}}{{site.name}} — {{site.tagline}}{{/if}}">
<meta name="twitter:description" content="{{#if pageDescription}}{{pageDescription}}{{else}}{{site.description}}{{/if}}">

<!-- Preconnect for fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..900&family=Source+Code+Pro:wght@400..700&display=swap">

<!-- Design System -->
<link rel="stylesheet" href="/css/design-system.css">

<!-- ProfessionalService Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "@id": "https://www.sunderandco.com/#organization",
  "name": "Sunder & Co.",
  "description": {{{json site.description}}},
  "url": "https://www.sunderandco.com",
  "email": "hello@sunderandco.com",
  "telephone": "{{site.phoneSchema}}",
  "areaServed": [
    "United States",
    "New Philadelphia, Ohio",
    "Dover, Ohio",
    "Canton, Ohio",
    "Tuscarawas County, Ohio",
    "Stark County, Ohio",
    "Holmes County, Ohio"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "Sales",
    "telephone": "{{site.phoneSchema}}",
    "email": "{{site.email}}",
    "areaServed": "US",
    "availableLanguage": "English"
  }
}
</script>
