<!-- Search Modal -->
<div class="search-modal" id="search-modal" aria-hidden="true">
  <div class="search-modal__backdrop" id="search-modal-close"></div>
  <div class="search-modal__content">
    <div class="search-modal__header">
      <div class="search-input-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search for services (e.g., SEO, Email, 3D)..." autocomplete="off" />
      </div>
      <button class="search-close-btn" id="search-close-btn" aria-label="Close search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="search-modal__results" id="search-results">
      <!-- Results will be injected here via JS -->
      <div class="search-empty-state">
        <p>Type to start searching across Sunder & Co. services.</p>
      </div>
    </div>
  </div>
</div>
